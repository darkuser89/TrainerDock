name: Build and release TrainerDock

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trainerdock-${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 40
    outputs:
      release_tag: ${{ steps.release_version.outputs.tag }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check platform and version
        id: release_version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 -B - <<'PY'
          import platform, subprocess
          assert platform.machine() == 'arm64', 'Apple Silicon required'
          assert int(platform.mac_ver()[0].split('.')[0]) >= 27, 'macOS 27+ required'
          sdk = subprocess.check_output(['xcrun', '--sdk', 'macosx', '--show-sdk-version'], text=True)
          assert int(sdk.split('.')[0]) >= 27, 'macOS 27 SDK required'
          PY
          python3 -B -m unittest discover -s Tests -p test_ci_version.py
          python3 -B script/ci_version.py
          xcodebuild -version
          dotnet --version
      - name: Download own managed build inputs
        run: |
          python3 -B - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          from script.managed import verified_managed_image
          root = Path.cwd()
          lock = json.loads((root / 'Config/ManagedImages.json').read_text())
          destination = Path(os.environ['TRAINERDOCK_MANAGED_IMAGES'])
          destination.mkdir()
          for name, entry in lock['modules'].items():
              url = 'https://github.com/darkuser89/TrainerDock/releases/download/' + lock['release'] + '/' + entry['file']
              with urllib.request.urlopen(url, timeout=60) as response:
                  data = response.read(1024 * 1024 + 1)
              (destination / entry['file']).write_bytes(data)
              module = root / 'Modules' / name
              verified_managed_image(destination, module, json.loads((module / 'Module.json').read_text()), json.loads((module / 'Build.json').read_text()))
          PY
      - name: Check build-input and renderer validation
        run: |
          python3 -B -m unittest discover -s Tests -p test_managed_inputs.py
          python3 -B -m unittest discover -s Tests -p test_build_renderer.py
      - name: Install build headers and standalone test LuaJIT
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install luajit libarchive
          printf 'TRAINERDOCK_TEST_LUA_LIBRARY=%s/lib/libluajit-5.1.dylib\n' "$(brew --prefix luajit)" >> "$GITHUB_ENV"
      - name: Build launcher, all trainers and synthetic tests
        env:
          TRAINERDOCK_ALLOW_MISSING_TEST_GPU: '1'
        run: |
          python3 -B script/build.py --configuration Release --version "$TRAINERDOCK_VERSION" --build-number "$GITHUB_RUN_NUMBER"
          git diff --exit-code -- TrainerDock.xcodeproj
      - name: Package verified products
        run: python3 -B script/release.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: TrainerDock-macOS-arm64
          path: ~/Library/Developer/TrainerDock/Distribution/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: TrainerDock-macOS-arm64
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published binaries.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" TrainerDock-macOS-arm64.zip SHA256SUMS --target "$RELEASE_COMMIT" --title "TrainerDock $RELEASE_TAG" --notes-file RELEASE_NOTES.md --latest
