name: Build and release TrainerDock

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Produktscope prüfen (kein erzwungener Neubau)'
        type: choice
        options: [auto, launcher, trainers]
        default: auto
      modules:
        description: 'Bei trainers: Modul-IDs mit Komma; leer = alle geänderten Trainer'
        type: string
        default: ''

permissions:
  contents: read

# One publication chain at a time; matrix builds inside it may run in parallel.
concurrency:
  group: trainerdock-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  GITHUB_TOKEN: ${{ github.token }}
  TRAINERDOCK_ALLOW_MISSING_TEST_GPU: '1'

jobs:
  plan:
    name: Compare published product contents
    runs-on: macos-latest
    timeout-minutes: 10
    outputs:
      launcher_changed: ${{ steps.plan.outputs.launcher_changed }}
      modules: ${{ steps.plan.outputs.modules }}
      any_changed: ${{ steps.plan.outputs.any_changed }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check distribution, workflow and localization contracts
        run: |
          python3 -B -m unittest discover -s Tests -p 'test_distribution*.py'
          python3 -B -m unittest discover -s Tests -p test_ci_version.py
          python3 -B -m unittest discover -s Tests -p test_ci_products.py
          python3 -B -m unittest discover -s Tests -p test_managed_inputs.py
          python3 -B -m unittest discover -s Tests -p test_build_renderer.py
          python3 -B -m unittest discover -s Tests -p test_localization.py
      - name: Plan against last confirmed catalog and validate manual scope
        id: plan
        env:
          BUILD_MODE: ${{ inputs.mode || 'auto' }}
          REQUESTED_MODULES: ${{ inputs.modules }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: python3 -B script/ci_products.py plan
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.plan.outputs.any_changed == 'true'
        with:
          name: trainerdock-plan
          path: |
            ~/Library/Developer/TrainerDock/Distribution/plan.json
            ~/Library/Developer/TrainerDock/Distribution/baseline.json
            ~/Library/Developer/TrainerDock/Distribution/ci-context.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  contracts:
    name: Native storage and archive contracts
    needs: plan
    if: needs.plan.outputs.any_changed == 'true'
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install native archive headers
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install libarchive
      - run: python3 -B Tests/TrainerDistribution/RunTests.py

  build_trainers:
    name: Trainer · ${{ matrix.module }}
    needs: plan
    if: needs.plan.outputs.modules != '[]'
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.modules) }}
    env:
      MODULE_ID: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -B script/ci_products.py init
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: trainerdock-plan
          path: ~/Library/Developer/TrainerDock/Distribution/
      - name: Check build platform and install test dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          python3 -B -c 'import platform,subprocess; assert platform.machine()=="arm64"; assert int(platform.mac_ver()[0].split(".")[0])>=27; assert int(subprocess.check_output(["xcrun","--sdk","macosx","--show-sdk-version"],text=True).split(".")[0])>=27'
          brew install luajit libarchive
          printf 'TRAINERDOCK_MANAGED_IMAGES=%s/managed-images\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'TRAINERDOCK_TEST_LUA_LIBRARY=%s/lib/libluajit-5.1.dylib\n' "$(brew --prefix luajit)" >> "$GITHUB_ENV"
      - name: Build, test, verify and package exactly this planned trainer
        run: python3 -B script/ci_products.py build-trainer --module "$MODULE_ID"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: trainerdock-trainer-${{ matrix.module }}
          path: ~/Library/Developer/TrainerDock/Distribution/Trainers/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  publish_trainers:
    name: Verify all trainer artifacts and publish catalog in order
    needs: [plan, contracts, build_trainers]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.any_changed == 'true' && needs.contracts.result == 'success' &&
      (needs.build_trainers.result == 'success' || needs.build_trainers.result == 'skipped') &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -B script/ci_products.py init
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: trainerdock-plan
          path: ~/Library/Developer/TrainerDock/Distribution/
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        if: needs.plan.outputs.modules != '[]'
        with:
          pattern: trainerdock-trainer-*
          merge-multiple: true
          path: ~/Library/Developer/TrainerDock/Distribution/Trainers/
      - name: Reject missing, mixed or changed artifacts before publishing
        run: python3 -B script/ci_products.py publish-trainers
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: trainerdock-published-catalog
          path: ~/Library/Developer/TrainerDock/Catalog/catalog.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  build_launcher:
    name: TrainerDock app only
    needs: [plan, contracts, publish_trainers]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.launcher_changed == 'true' && needs.contracts.result == 'success' &&
      (needs.publish_trainers.result == 'success' ||
       (needs.publish_trainers.result == 'skipped' &&
        (github.event_name == 'pull_request' ||
         (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')))))
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -B script/ci_products.py init
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: trainerdock-plan
          path: ~/Library/Developer/TrainerDock/Distribution/
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        if: needs.publish_trainers.result == 'success'
        with:
          name: trainerdock-published-catalog
          path: ~/Library/Developer/TrainerDock/Catalog/
      - name: Install native archive headers
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install libarchive
      - name: Build and verify app with the confirmed trainer catalog
        run: python3 -B script/ci_products.py build-launcher
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: trainerdock-launcher
          path: |
            ~/Library/Developer/TrainerDock/Distribution/TrainerDock-macOS-arm64.zip
            ~/Library/Developer/TrainerDock/Distribution/launcher-record.json
            ~/Library/Developer/TrainerDock/Distribution/launcher-build.json
            ~/Library/Developer/TrainerDock/Distribution/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  publish_launcher:
    name: Verify and publish TrainerDock app
    needs: [plan, publish_trainers, build_launcher]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      needs.publish_trainers.result == 'success' && needs.build_launcher.result == 'success' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -B script/ci_products.py init
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: trainerdock-plan
          path: ~/Library/Developer/TrainerDock/Distribution/
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: trainerdock-published-catalog
          path: ~/Library/Developer/TrainerDock/Catalog/
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: trainerdock-launcher
          path: ~/Library/Developer/TrainerDock/Distribution/
      - name: Verify source-bound app artifact before immutable release
        run: python3 -B script/ci_products.py publish-launcher
