name: Build and release TrainerDock

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trainerdock-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selective:
    runs-on: xcode-27
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      GITHUB_TOKEN: ${{ github.token }}
      TRAINERDOCK_ALLOW_MISSING_TEST_GPU: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check distribution contracts
        run: |
          python3 -B -m unittest discover -s Tests -p 'test_distribution*.py'
          python3 -B -m unittest discover -s Tests -p test_ci_version.py
          python3 -B -m unittest discover -s Tests -p test_managed_inputs.py
          python3 -B -m unittest discover -s Tests -p test_build_renderer.py
      - name: Compare with last successful publication
        id: plan
        run: python3 -B script/trainer_distribution.py plan
      - name: Check build platform
        if: steps.plan.outputs.any_changed == 'true'
        run: |
          python3 -B - <<'PY'
          import platform, subprocess
          assert platform.machine() == 'arm64'
          assert int(platform.mac_ver()[0].split('.')[0]) >= 27
          assert int(subprocess.check_output(['xcrun','--sdk','macosx','--show-sdk-version'],text=True).split('.')[0]) >= 27
          PY
          xcodebuild -version
      - name: Choose launcher version only when launcher changed
        id: release_version
        if: steps.plan.outputs.launcher_changed == 'true'
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: python3 -B script/ci_version.py
      - name: Install build headers and isolated test LuaJIT
        if: steps.plan.outputs.any_changed == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install luajit libarchive
          printf 'TRAINERDOCK_TEST_LUA_LIBRARY=%s/lib/libluajit-5.1.dylib\n' "$(brew --prefix luajit)" >> "$GITHUB_ENV"
          printf 'TRAINERDOCK_MANAGED_IMAGES=%s/managed-images\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check native trainer storage and archive boundaries
        if: steps.plan.outputs.any_changed == 'true'
        run: python3 -B Tests/TrainerDistribution/RunTests.py
      - name: Download own C# inputs only for changed managed trainers
        if: steps.plan.outputs.modules != '[]'
        env:
          CHANGED_MODULES: ${{ steps.plan.outputs.modules }}
        run: |
          python3 -B - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          from script.managed import verified_managed_image
          lock=json.loads(Path('Config/ManagedImages.json').read_text())
          destination=Path(os.environ['TRAINERDOCK_MANAGED_IMAGES']);destination.mkdir(parents=True,exist_ok=True)
          for name in json.loads(os.environ['CHANGED_MODULES']):
              if name not in lock['modules']:continue
              entry=lock['modules'][name]
              url='https://github.com/darkuser89/TrainerDock/releases/download/'+lock['release']+'/'+entry['file']
              with urllib.request.urlopen(url,timeout=60) as response:data=response.read(1024*1024+1)
              (destination/entry['file']).write_bytes(data)
              module=Path('Modules')/name
              verified_managed_image(destination,module,json.loads((module/'Module.json').read_text()),json.loads((module/'Build.json').read_text()))
          PY
      - name: Build and package only changed trainers
        if: steps.plan.outputs.modules != '[]'
        env:
          CHANGED_MODULES: ${{ steps.plan.outputs.modules }}
        run: |
          python3 -B - <<'PY'
          import json,os,subprocess,sys
          for name in json.loads(os.environ['CHANGED_MODULES']):
              subprocess.run([sys.executable,'-B','script/build.py','--module',name,'--configuration','Release'],check=True)
          PY
          python3 -B script/trainer_distribution.py package
      - name: Empty trainer package plan
        if: steps.plan.outputs.modules == '[]'
        run: python3 -B script/trainer_distribution.py package
      - name: Check performance boundaries of affected trainers
        if: steps.plan.outputs.modules != '[]'
        env:
          CHANGED_MODULES: ${{ steps.plan.outputs.modules }}
        run: |
          python3 -B - <<'PY'
          import json,os,subprocess,sys
          changed=json.loads(os.environ['CHANGED_MODULES'])
          suites=[('Tests/Managed/RunPerformanceTests.py',{'the-long-dark','vampire-crawlers','terraria'},[]),
                  ('Tests/UnrealPerformance/RunPerformanceTests.py',{'frostpunk-2','inzoi','stray'},[]),
                  ('Tests/NativePerformance/RunPerformanceTests.py',{'control','no-mans-sky','resident-evil-2','resident-evil-3','resident-evil-4','resident-evil-7','resident-evil-village','turok','turok-2'},['--configuration','Release'])]
          for path,ids,extra in suites:
              selected=sorted(set(changed)&ids)
              if selected:subprocess.run([sys.executable,'-B',path,*extra,'--modules',*selected],check=True)
          if set(changed)&{'escape-from-duckov','vampire-survivors'}:
              subprocess.run([sys.executable,'-B','Tests/Managed/ManagedHotPathTests.py'],check=True)
          PY
      - name: Publish verified trainers before catalog
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.plan.outputs.any_changed == 'true'
        run: python3 -B script/trainer_distribution.py publish-trainers
      - name: Build launcher without trainer dependencies
        if: steps.plan.outputs.launcher_changed == 'true'
        run: |
          python3 -B script/build.py --launcher-only --configuration Release --version "$TRAINERDOCK_VERSION" --build-number "$GITHUB_RUN_NUMBER"
          python3 -B script/release.py
          git diff --exit-code -- TrainerDock.xcodeproj
      - name: Publish launcher and confirmed launcher fingerprint
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.plan.outputs.launcher_changed == 'true'
        run: python3 -B script/trainer_distribution.py publish-launcher
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.plan.outputs.any_changed == 'true'
        with:
          name: TrainerDock-selected-products
          path: ~/Library/Developer/TrainerDock/Distribution/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
